<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DocCheck Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #0f172a; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); padding: 20px; }
  </style>
</head>
<body class="p-8">

  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <header class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">DocCheck Engine</h1>
        <p class="text-slate-500 mt-1">Real-time Application Audit</p>
      </div>
      <div class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-full font-medium text-sm">
        System Status: Online
      </div>
    </header>

    <!-- KPIs -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
      <div class="card border-t-4 border-slate-900">
        <h3 class="text-slate-500 text-sm font-medium uppercase tracking-wider">Total Reviewed</h3>
        <p class="text-4xl font-bold mt-2" id="kpi-total">-</p>
      </div>
      <div class="card border-t-4 border-emerald-500">
        <h3 class="text-slate-500 text-sm font-medium uppercase tracking-wider">Approved</h3>
        <p class="text-4xl font-bold mt-2 text-emerald-600" id="kpi-approved">-</p>
      </div>
      <div class="card border-t-4 border-rose-500">
        <h3 class="text-slate-500 text-sm font-medium uppercase tracking-wider">Flagged</h3>
        <p class="text-4xl font-bold mt-2 text-rose-600" id="kpi-flagged">-</p>
      </div>
      <div class="card border-t-4 border-amber-500">
        <h3 class="text-slate-500 text-sm font-medium uppercase tracking-wider">Manual Review</h3>
        <p class="text-4xl font-bold mt-2 text-amber-600" id="kpi-manual">-</p>
      </div>
    </div>

    <!-- Applications Table -->
    <div class="card">
      <h2 class="text-xl font-bold mb-4">Recent Applications</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="text-slate-500 border-b border-slate-200 text-sm uppercase tracking-wider">
              <th class="py-3 px-4 font-semibold">ID</th>
              <th class="py-3 px-4 font-semibold">Risk Level</th>
              <th class="py-3 px-4 font-semibold">Status</th>
              <th class="py-3 px-4 font-semibold">Action</th>
            </tr>
          </thead>
          <tbody id="applications-table" class="divide-y divide-slate-100">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        // Fetch analytics
        const analyticsRes = await fetch('/api/analytics');
        if (analyticsRes.ok) {
          const stats = await analyticsRes.json();
          document.getElementById('kpi-total').textContent = stats.total_applications || 0;
          document.getElementById('kpi-approved').textContent = stats.approved || 0;
          document.getElementById('kpi-flagged').textContent = stats.flagged || 0;
          document.getElementById('kpi-manual').textContent = stats.manual_review || 0;
        }

        // Fetch applications
        const appsRes = await fetch('/api/applications');
        if (appsRes.ok) {
          const apps = await appsRes.json();
          const tbody = document.getElementById('applications-table');
          tbody.innerHTML = '';
          
          apps.slice(0, 10).forEach(app => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-50 transition-colors';
            
            // Status colors
            let statusColor = 'text-slate-600 bg-slate-100';
            if (app.status === 'APPROVED') statusColor = 'text-emerald-700 bg-emerald-100';
            if (app.status === 'FLAGGED' || app.status === 'REJECTED') statusColor = 'text-rose-700 bg-rose-100';
            if (app.status === 'MANUAL_REVIEW') statusColor = 'text-amber-700 bg-amber-100';

            // Risk colors
            let riskColor = 'text-slate-500';
            if (app.risk_level === 'HIGH') riskColor = 'text-rose-600 font-bold';
            if (app.risk_level === 'MEDIUM') riskColor = 'text-amber-600 font-bold';
            if (app.risk_level === 'LOW') riskColor = 'text-emerald-600 font-bold';

            tr.innerHTML = `
              <td class="py-3 px-4 font-mono text-sm">${app.application_id}</td>
              <td class="py-3 px-4 text-sm ${riskColor}">${app.risk_level}</td>
              <td class="py-3 px-4">
                <span class="px-2 py-1 rounded text-xs font-semibold ${statusColor}">${app.status}</span>
              </td>
              <td class="py-3 px-4">
                <button class="text-indigo-600 hover:text-indigo-900 text-sm font-medium">View</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (error) {
        console.error('Error loading dashboard data:', error);
      }
    }

    // Load data on start
    loadDashboard();
    
    // Refresh every 10 seconds
    setInterval(loadDashboard, 10000);
  </script>
</body>
</html>
