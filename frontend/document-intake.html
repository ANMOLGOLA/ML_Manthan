<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DocCheck Intake</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #0f172a; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); padding: 20px; border: 1px solid #e2e8f0; }
  </style>
</head>
<body class="p-8">

  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <header class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Document Intake</h1>
        <p class="text-slate-500 mt-1">Upload files for OCR and automated review</p>
      </div>
      <div class="flex gap-4">
        <a href="/" class="text-indigo-600 hover:text-indigo-900 font-medium">← Back to Dashboard</a>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Upload Section -->
      <div class="card">
        <h2 class="text-xl font-bold mb-4">Upload Document</h2>
        <form id="upload-form" class="flex flex-col gap-4">
          <div class="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center bg-slate-50 hover:bg-slate-100 transition-colors cursor-pointer" onclick="document.getElementById('file-upload').click()">
            <svg class="mx-auto h-12 w-12 text-slate-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
              <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <p class="mt-2 text-sm text-slate-600">Click to upload or drag and drop</p>
            <p class="text-xs text-slate-500">PDF, PNG, JPG up to 10MB</p>
            <input id="file-upload" name="file" type="file" class="sr-only" accept=".pdf,.png,.jpg,.jpeg">
          </div>
          <div id="file-name" class="text-sm font-medium text-slate-700 truncate hidden"></div>
          
          <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white font-semibold py-2.5 rounded-lg hover:bg-slate-800 transition-colors disabled:opacity-50">
            Run OCR & Process
          </button>
        </form>
      </div>

      <!-- Results Section -->
      <div class="card bg-slate-900 text-slate-50 flex flex-col h-full hidden" id="result-card">
        <h2 class="text-xl font-bold mb-4 text-white">Extraction Result</h2>
        <div id="loading" class="hidden flex-1 flex items-center justify-center">
          <div class="animate-pulse flex flex-col items-center">
            <div class="h-8 w-8 bg-indigo-500 rounded-full mb-4"></div>
            <span class="text-slate-400 font-mono text-sm">Processing with OCR Engine...</span>
          </div>
        </div>
        <div id="result-content" class="flex-1 overflow-auto hidden flex flex-col gap-4">
          <div>
            <span class="text-slate-400 text-xs font-mono uppercase tracking-wider block mb-1">Applicant Name</span>
            <span id="res-name" class="font-semibold text-lg text-white"></span>
          </div>
          <div class="grid grid-cols-2 gap-4 border-t border-slate-700 pt-4">
            <div>
              <span class="text-slate-400 text-xs font-mono uppercase tracking-wider block mb-1">Status</span>
              <span id="res-status" class="font-semibold rounded px-2 py-0.5 text-sm bg-slate-800"></span>
            </div>
            <div>
              <span class="text-slate-400 text-xs font-mono uppercase tracking-wider block mb-1">Risk</span>
              <span id="res-risk" class="font-semibold rounded px-2 py-0.5 text-sm bg-slate-800"></span>
            </div>
            <div>
              <span class="text-slate-400 text-xs font-mono uppercase tracking-wider block mb-1">Stated Income</span>
              <span id="res-income" class="font-mono text-emerald-400"></span>
            </div>
            <div>
              <span class="text-slate-400 text-xs font-mono uppercase tracking-wider block mb-1">Loan Amount</span>
              <span id="res-loan" class="font-mono text-sky-400"></span>
            </div>
          </div>
          <div class="border-t border-slate-700 pt-4">
            <span class="text-slate-400 text-xs font-mono uppercase tracking-wider block mb-2">Audit Trace</span>
            <pre id="res-json" class="text-[10px] text-slate-300 bg-slate-950 p-3 rounded-lg overflow-x-auto border border-slate-800"></pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('file-upload');
    const form = document.getElementById('upload-form');
    
    fileInput.addEventListener('change', (e) => {
      const nameDisplay = document.getElementById('file-name');
      if (e.target.files.length > 0) {
        nameDisplay.textContent = `Selected: ${e.target.files[0].name}`;
        nameDisplay.classList.remove('hidden');
      } else {
        nameDisplay.classList.add('hidden');
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (fileInput.files.length === 0) {
        alert("Please select a file first.");
        return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      // UI States
      const submitBtn = document.getElementById('submit-btn');
      const resultCard = document.getElementById('result-card');
      const loading = document.getElementById('loading');
      const resultContent = document.getElementById('result-content');

      submitBtn.disabled = true;
      submitBtn.textContent = "Processing...";
      resultCard.classList.remove('hidden');
      loading.classList.remove('hidden');
      resultContent.classList.add('hidden');

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error("Upload failed: " + response.statusText);
        }

        const data = await response.json();
        
        // Populate Results
        document.getElementById('res-name').textContent = data.applicant_name;
        document.getElementById('res-status').textContent = data.status;
        document.getElementById('res-risk').textContent = data.risk_level;
        
        // Format Currency safely
        const formatMoney = (val) => val ? '$' + val.toLocaleString() : '$0';
        document.getElementById('res-income').textContent = formatMoney(data.extracted_data?.stated_monthly_income);
        document.getElementById('res-loan').textContent = formatMoney(data.extracted_data?.requested_loan_amount);
        
        document.getElementById('res-json').textContent = JSON.stringify(data, null, 2);

        // Color coding
        const statusEl = document.getElementById('res-status');
        statusEl.className = 'font-semibold rounded px-2 py-0.5 text-sm ' + 
          (data.status === 'APPROVED' ? 'bg-emerald-900 text-emerald-300' : 'bg-rose-900 text-rose-300');

      } catch (err) {
        alert("An error occurred: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Run OCR & Process";
        loading.classList.add('hidden');
        resultContent.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
